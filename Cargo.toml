[package]
name = "vlc-tty"
version = "0.0.1"
edition = "2021"
description = "Terminal-first video player with LibVLC, Ratatui and headless SSH playback"
repository = "https://github.com/chinmaykrishnroy/VLC-TTY"
license = "MIT"
default-run = "vlc-tty"

[features]
default = ["audio-client"]
audio-client = ["dep:cpal"]

[[bin]]
name = "vlc-tty"
path = "src/main.rs"

[[bin]]
name = "vlc-tty-portable"
path = "src/portable/main.rs"

[dependencies]
anyhow = "1"
libloading = "0.8"
ratatui = { version = "0.30.0", features = ["crossterm"] }
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm"] }
image = { version = "0.25.6", default-features = false, features = ["png", "jpeg"] }
icy_sixel = "0.5.1"
quantette = { version = "0.6.0", default-features = false }
flate2 = "1"
tar = "0.4"
sha2 = "0.10"
tempfile = "3"
rand = "0.8"
crossbeam-queue = "0.3"
cpal = { version = "0.16", optional = true }
ureq = { version = "3", default-features = false }

[dev-dependencies]
base64 = "0.22"

[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Console", "Win32_Security", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm"] }
