[package]
name = "termvlc"
version = "0.4.0"
edition = "2021"
description = "LibVLC media playback inside a pixel-graphics terminal on Windows, Linux and macOS, with graceful ANSI fallback"
license = "MIT"

[dependencies]
anyhow = "1"
libloading = "0.8"
ratatui = { version = "0.30.0", features = ["crossterm"] }
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm", "image-defaults"] }
image = { version = "0.25.6", default-features = false, features = ["png"] }
icy_sixel = "0.5.1"
