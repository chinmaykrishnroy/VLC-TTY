name: Native builds and playback checks

on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  PYTHONUTF8: '1'

jobs:
  native:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    env:
      CARGO_BUILD_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Format
        run: cargo fmt --all -- --check
      - name: Unit regressions
        run: cargo test --locked --all-targets
      - name: Strict Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Packaging regressions
        run: python -m unittest discover -s scripts -p test_*.py -v
      - name: Install matching LibVLC runtime
        run: python scripts/ci_install_vlc.py ${{ matrix.target }}
      - name: Require real file and HTTP decoding, controls and silent mode
        run: cargo test --locked --all-targets -- --ignored --test-threads=1 --nocapture
      - name: Build standalone executable with matching runtime and sources
        run: python scripts/build_portable.py ${{ matrix.target }} --with-sources
      - name: Verify the single file without installed-runtime paths
        run: python scripts/verify_portable.py --target ${{ matrix.target }}
      - name: Require decoding in a container with no VLC packages
        if: runner.os == 'Linux'
        shell: bash
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: python scripts/container_smoke.py "$RELEASE_TARGET"
      - uses: actions/upload-artifact@v7
        with:
          name: vlc-tty-${{ matrix.target }}
          path: |
            dist/*
            !dist/*-runtime-sources.tar.gz
            !dist/*-runtime-sources.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: runner.os == 'Linux'
        with:
          name: vlc-tty-${{ matrix.target }}-runtime-sources
          path: dist/*-runtime-sources.tar.gz*
          if-no-files-found: error
          retention-days: 14

  ubuntu-server:
    name: Ubuntu 26.04 ARM64 headless decoding
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Runtime without a desktop
        run: python3 scripts/ci_install_vlc.py aarch64-unknown-linux-gnu
      - name: Decode without display or sound device
        run: |
          unset DISPLAY WAYLAND_DISPLAY
          cargo test --locked --all-targets -- --ignored --test-threads=1 --nocapture
          cargo run --locked -- --ssh --smoke-test samples/sample.mp4
      - name: Exercise real terminal controls without cursor-report replies
        run: python3 scripts/pty_smoke.py target/debug/vlc-tty samples/sample.mp4 --expect-caption TermVLC

  runtime-sources:
    name: Preserve VLC and contributed dependency sources
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Collect verified upstream sources
        run: python3 scripts/collect_sources.py --upstream dist/vlc-3.0.24-source-snapshot.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: vlc-tty-runtime-sources
          path: dist/*
          if-no-files-found: error
          retention-days: 14
