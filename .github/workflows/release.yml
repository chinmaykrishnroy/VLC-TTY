name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build.yml

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: vlc-tty-*
          path: dist
          merge-multiple: true
      - name: Verify all six archives and aggregate checksums
        run: python3 scripts/release_manifest.py dist
      - name: Publish verified application archives
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/*.zip dist/*.tar.gz dist/SHA256SUMS \
            --verify-tag --title "VLC-TTY $RELEASE_TAG" --generate-notes \
            --notes 'Application-only executables for six native targets. Install matching LibVLC 3 libraries and plugins separately; see README and SSH guide. Pi 5 and terminal visual acceptance remain separate from automated decoding checks.'
